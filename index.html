<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <title>Caesar Cipher Decoder – Norwegian 29-Letter Alphabet</title>
    <meta name="description" content="Decode Caesar ciphers using the Norwegian 29-letter alphabet (A–Z, Æ, Ø, Å). Try all shifts instantly with this Caesar cipher decoder.">
    <link rel="canonical" href="https://4nch3r.github.io/Caesar-decrypter-norwegian-29-alphabet/">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <meta property="og:title" content="Caesar Cipher Decoder – Norwegian Alphabet">
    <meta property="og:description" content="Decode Caesar ciphers using the Norwegian 29-letter alphabet.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://4nch3r.github.io/Caesar-decrypter-norwegian-29-alphabet/">
</head>
<body>
    <div class="app-shell">
        <div class="app-card">
            <div class="hero">
                <p class="eyebrow">Kryptografi-verktøy</p>
                <h1>Caesar-dekryptering med norsk alfabet</h1>
                <p class="subtitle">
                    Skriv inn ett ord eller en setning. Verktøyet prøver alle Caesar-skift i det norske alfabetet, inkludert Æ, Ø og Å.
                </p>
            </div>

            <div class="input-section">
                <label for="cipher">Kryptert tekst</label>
                <div class="input-row">
                    <input id="cipher" type="text" placeholder="f.eks. Mhj hu nxo">
                    <button onclick="analyze()">Analyser</button>
                </div>
            </div>

            <div class="chart-section">
                <canvas id="chart"></canvas>
            </div>

            <div id="output" class="output-card"></div>
        </div>
    </div>

<script>
const norwegianAlphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZÆØÅ";
const alphabetLength = norwegianAlphabet.length;

let dictionaryLineSet = new Set();   // hele fraser
let dictionaryWordSet = new Set();   // enkeltord
let dictionaryWordsArray = [];       // for streng delmatch på lange ord
let chartInstance = null;

// ---------------------------
// Normalisering
// ---------------------------
function normalizeText(text) {
    return text
        .toUpperCase()
        .replace(/[^A-ZÆØÅ0-9\s]/g, " ")
        .replace(/\s+/g, " ")
        .trim();
}

function extractWords(text) {
    const normalized = normalizeText(text);
    if (!normalized) return [];
    return normalized.split(" ").filter(Boolean);
}

function escapeHtml(text) {
    return text
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;");
}

// ---------------------------
// Last inn ordlisten
// ---------------------------
fetch("ordliste.txt")
    .then(response => response.text())
    .then(data => {
        const rawLines = data.split(/\r?\n/);

        const normalizedLines = rawLines
            .map(line => normalizeText(line))
            .filter(Boolean);

        dictionaryLineSet = new Set(normalizedLines);

        const wordSet = new Set();
        for (const line of normalizedLines) {
            const words = extractWords(line);
            for (const word of words) {
                wordSet.add(word);
            }
        }

        dictionaryWordSet = wordSet;
        dictionaryWordsArray = Array.from(dictionaryWordSet);

        console.log("Ordliste lastet:");
        console.log("- Fraser:", dictionaryLineSet.size);
        console.log("- Unike ord:", dictionaryWordSet.size);
    })
    .catch(error => {
        console.error("Kunne ikke laste ordliste.txt:", error);
        document.getElementById("output").innerHTML =
            "<p><strong>Feil:</strong> Kunne ikke laste ordliste.txt.</p>";
    });

// ---------------------------
// Caesar-dekryptering
// ---------------------------
function caesarDecrypt(text, shift) {
    return text.split("").map(char => {
        const upperChar = char.toUpperCase();
        const index = norwegianAlphabet.indexOf(upperChar);

        if (index === -1) return char;

        const newIndex = (index - shift + alphabetLength) % alphabetLength;
        return norwegianAlphabet[newIndex];
    }).join("");
}

// ---------------------------
// Streng delmatch for LANGE ord
// Brukes bare som svak bonus
// ---------------------------
function getStrictPartialWordScore(word) {
    const w = word.toUpperCase();

    // Ikke bruk deltreff for korte ord
    if (w.length < 5) return 0;

    let bestScore = 0;

    for (const dictWord of dictionaryWordsArray) {
        // Ikke bruk korte ordboksord her heller
        if (dictWord.length < 4) continue;

        // Ikke eksakt match her
        if (w === dictWord) continue;

        // Lengdene må være ganske like
        if (Math.abs(w.length - dictWord.length) > 2) continue;

        // Krev samme første og siste bokstav
        if (w[0] !== dictWord[0]) continue;
        if (w[w.length - 1] !== dictWord[dictWord.length - 1]) continue;

        // Veldig enkel, streng delmatch:
        // enten kandidatord inneholder ordboksordet
        // eller ordboksordet inneholder kandidatordet
        if (w.includes(dictWord) || dictWord.includes(w)) {
            const coverage = Math.min(w.length, dictWord.length) / Math.max(w.length, dictWord.length);
            const score = coverage * 100;

            if (score > bestScore) {
                bestScore = score;
            }
        }
    }

    // Krev veldig høy overlapp
    if (bestScore < 80) return 0;

    return bestScore;
}

// ---------------------------
// Score kandidattekst
// ---------------------------
function scoreCandidateText(text) {
    const normalizedText = normalizeText(text);
    const words = extractWords(text);

    if (!normalizedText || words.length === 0) {
        return {
            score: 0,
            exactLineMatch: false,
            allWordsExact: false,
            exactWords: 0,
            partialWords: 0,
            totalWords: 0,
            details: []
        };
    }

    // 1) Eksakt frasematch
    if (dictionaryLineSet.has(normalizedText)) {
        return {
            score: 100,
            exactLineMatch: true,
            allWordsExact: true,
            exactWords: words.length,
            partialWords: 0,
            totalWords: words.length,
            details: words.map(w => `${w} (100%)`)
        };
    }

    // 2) Alle ord matcher eksakt
    const allWordsAreExact = words.every(word => dictionaryWordSet.has(word));
    if (allWordsAreExact) {
        return {
            score: 100,
            exactLineMatch: false,
            allWordsExact: true,
            exactWords: words.length,
            partialWords: 0,
            totalWords: words.length,
            details: words.map(w => `${w} (100%)`)
        };
    }

    // 3) Ellers: score baseres først og fremst på eksakte ord
    let totalLetters = 0;
    let exactLetters = 0;
    let partialBonus = 0;
    let exactWords = 0;
    let partialWords = 0;
    const details = [];

    for (const word of words) {
        const len = word.length;
        totalLetters += len;

        if (dictionaryWordSet.has(word)) {
            exactWords++;
            exactLetters += len;
            details.push(`${word} (100%)`);
            continue;
        }

        const partialScore = getStrictPartialWordScore(word);

        if (partialScore > 0) {
            partialWords++;

            // Deltreff gir bare en liten bonus
            // og aldri i nærheten av et eksakt ord
            partialBonus += len * (partialScore / 100) * 0.12;

            details.push(`${word} (${partialScore.toFixed(1)}%)`);
        } else {
            details.push(`${word} (0%)`);
        }
    }

    let finalScore = 0;

    if (totalLetters > 0) {
        finalScore = ((exactLetters + partialBonus) / totalLetters) * 100;
    }

    if (finalScore > 100) finalScore = 100;

    return {
        score: finalScore,
        exactLineMatch: false,
        allWordsExact: false,
        exactWords,
        partialWords,
        totalWords: words.length,
        details
    };
}

// ---------------------------
// Analysefunksjon
// ---------------------------
function analyze() {
    const cipherInput = document.getElementById("cipher").value.trim();

    if (!cipherInput) {
        document.getElementById("output").innerHTML = "<p>Skriv inn tekst først.</p>";
        return;
    }

    if (dictionaryWordSet.size === 0 && dictionaryLineSet.size === 0) {
        document.getElementById("output").innerHTML =
            "<p>Ordliste er ikke lastet ennå. Prøv igjen om et øyeblikk.</p>";
        return;
    }

    const shifts = [];

    for (let shift = 0; shift < alphabetLength; shift++) {
        const plain = caesarDecrypt(cipherInput, shift);
        const analysis = scoreCandidateText(plain);

        shifts.push({
            shift,
            text: plain,
            probability: analysis.score,
            exactLineMatch: analysis.exactLineMatch,
            allWordsExact: analysis.allWordsExact,
            exactWords: analysis.exactWords,
            partialWords: analysis.partialWords,
            totalWords: analysis.totalWords,
            details: analysis.details
        });
    }

    const ranked = [...shifts].sort((a, b) => {
        if (b.probability !== a.probability) return b.probability - a.probability;
        if (b.exactWords !== a.exactWords) return b.exactWords - a.exactWords;
        return a.shift - b.shift;
    });

    const best = ranked[0];

    document.getElementById("output").innerHTML = `
        <h3>Mest sannsynlige dekryptering</h3>
        <p>
            <strong>${escapeHtml(best.text)}</strong><br>
            Shift ${best.shift} · score ${best.probability.toFixed(1)}%
        </p>

        <p>
            Eksakte ord: ${best.exactWords}/${best.totalWords}<br>
            Deltreff: ${best.partialWords}<br>
            Eksakt frasematch: ${best.exactLineMatch ? "Ja" : "Nei"}<br>
            Alle ord eksakte: ${best.allWordsExact ? "Ja" : "Nei"}
        </p>

        <h3>Ordvurdering</h3>
        <p>${escapeHtml(best.details.join(", "))}</p>

        <h3>Topp 10 dekrypteringer</h3>
        <pre>${escapeHtml(
            ranked
                .slice(0, 10)
                .map(item =>
                    `${item.shift}: ${item.text}  [${item.probability.toFixed(1)}% | eksakte ord: ${item.exactWords}/${item.totalWords} | deltreff: ${item.partialWords}]`
                )
                .join("\n")
        )}</pre>
    `;

    drawChart(shifts, best.shift);
}

// ---------------------------
// Tegn graf med Chart.js
// ---------------------------
function drawChart(shiftResults, bestShift) {
    const ctx = document.getElementById("chart").getContext("2d");

    if (chartInstance) {
        chartInstance.destroy();
    }

    const labels = shiftResults.map(item => `Shift ${item.shift}`);
    const data = shiftResults.map(item => Number(item.probability.toFixed(1)));
    const backgroundColors = shiftResults.map(item =>
        item.shift === bestShift
            ? "rgba(16, 185, 129, 0.85)"
            : "rgba(79, 70, 229, 0.75)"
    );

    chartInstance = new Chart(ctx, {
        type: "bar",
        data: {
            labels,
            datasets: [{
                label: "Sannsynlighet basert på ordtreff",
                data,
                backgroundColor: backgroundColors,
                borderRadius: 8,
                borderSkipped: false
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: {
                    labels: {
                        color: "#334155"
                    }
                },
                tooltip: {
                    callbacks: {
                        label: function(context) {
                            return ` Score: ${context.raw}%`;
                        }
                    }
                }
            },
            scales: {
                x: {
                    ticks: {
                        color: "#475569"
                    },
                    grid: {
                        display: false
                    }
                },
                y: {
                    beginAtZero: true,
                    max: 100,
                    ticks: {
                        color: "#475569"
                    },
                    title: {
                        display: true,
                        text: "Prosent (%)",
                        color: "#334155"
                    },
                    grid: {
                        color: "rgba(148, 163, 184, 0.2)"
                    }
                }
            }
        }
    });
}
</script>
</body>
</html>
