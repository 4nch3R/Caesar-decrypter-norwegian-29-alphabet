<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <title>Caesar Cipher Decoder – Norwegian 29-Letter Alphabet</title>
    <meta name="description" content="Decode Caesar ciphers using the Norwegian 29-letter alphabet (A–Z, Æ, Ø, Å). Try all shifts instantly with this Caesar cipher decoder.">
    <link rel="canonical" href="https://4nch3r.github.io/Caesar-decrypter-norwegian-29-alphabet/">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <meta property="og:title" content="Caesar Cipher Decoder – Norwegian Alphabet">
    <meta property="og:description" content="Decode Caesar ciphers using the Norwegian 29-letter alphabet.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://4nch3r.github.io/Caesar-decrypter-norwegian-29-alphabet/">
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app-shell">
    <div class="app-card">

        <div class="hero">
            <p class="eyebrow">Kryptografi-verktøy</p>
            <h1>Caesar-dekryptering med norsk alfabet</h1>
            <p class="subtitle">
                Skriv inn ett ord eller en setning. Verktøyet prøver alle Caesar-skift i det norske alfabetet, inkludert Æ, Ø og Å.
            </p>
        </div>

        <div class="input-section">
            <label for="cipher">Kryptert tekst</label>

            <div class="input-row">
                <input id="cipher" type="text" placeholder="f.eks. Mhj hu nxo">
                <button onclick="analyze()">Analyser</button>
            </div>
        </div>

        <div class="chart-section">
            <canvas id="chart"></canvas>
        </div>

        <div id="output" class="output-card"></div>

    </div>
</div>

<!-- Chart.js bibliotek (MANGLET I ORIGINALEN) -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>

const norwegianAlphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZÆØÅ";
const alphabetLength = norwegianAlphabet.length;

let dictionaryLineSet = new Set();
let dictionaryWordSet = new Set();
let dictionaryWordsArray = [];
let chartInstance = null;

function normalizeText(text) {
    return text
        .toUpperCase()
        .replace(/[^A-ZÆØÅ0-9\s]/g, " ")
        .replace(/\s+/g, " ")
        .trim();
}

function extractWords(text) {
    const normalized = normalizeText(text);
    if (!normalized) return [];
    return normalized.split(" ").filter(Boolean);
}

function escapeHtml(text) {
    return text
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;");
}


fetch("ordliste.txt")
    .then(response => response.text())
    .then(data => {

        const rawLines = data.split(/\r?\n/);

        const normalizedLines = rawLines
            .map(line => normalizeText(line))
            .filter(Boolean);

        dictionaryLineSet = new Set(normalizedLines);

        const wordSet = new Set();

        for (const line of normalizedLines) {

            const words = extractWords(line);

            for (const word of words) {
                wordSet.add(word);
            }
        }

        dictionaryWordSet = wordSet;
        dictionaryWordsArray = Array.from(dictionaryWordSet);

    })
    .catch(error => {

        console.error("Kunne ikke laste ordliste.txt:", error);

        document.getElementById("output").innerHTML =
            "<p><strong>Feil:</strong> Kunne ikke laste ordliste.txt.</p>";
    });


function caesarDecrypt(text, shift) {

    return text.split("").map(char => {

        const upperChar = char.toUpperCase();
        const index = norwegianAlphabet.indexOf(upperChar);

        if (index === -1) return char;

        const newIndex = (index - shift + alphabetLength) % alphabetLength;

        return norwegianAlphabet[newIndex];

    }).join("");
}


function getStrictPartialWordScore(word) {

    const w = word.toUpperCase();

    if (w.length < 5) return 0;

    let bestScore = 0;

    for (const dictWord of dictionaryWordsArray) {

        if (dictWord.length < 4) continue;
        if (w === dictWord) continue;

        if (Math.abs(w.length - dictWord.length) > 2) continue;

        if (w[0] !== dictWord[0]) continue;
        if (w[w.length - 1] !== dictWord[dictWord.length - 1]) continue;

        if (w.includes(dictWord) || dictWord.includes(w)) {

            const coverage =
                Math.min(w.length, dictWord.length) /
                Math.max(w.length, dictWord.length);

            const score = coverage * 100;

            if (score > bestScore) {
                bestScore = score;
            }
        }
    }

    if (bestScore < 80) return 0;

    return bestScore;
}


function scoreCandidateText(text) {

    const normalizedText = normalizeText(text);
    const words = extractWords(text);

    if (!normalizedText || words.length === 0) {

        return {
            score: 0,
            exactLineMatch: false,
            allWordsExact: false,
            exactWords: 0,
            partialWords: 0,
            totalWords: 0,
            details: []
        };
    }

    if (dictionaryLineSet.has(normalizedText)) {

        return {
            score: 100,
            exactLineMatch: true,
            allWordsExact: true,
            exactWords: words.length,
            partialWords: 0,
            totalWords: words.length,
            details: words.map(w => `${w} (100%)`)
        };
    }

    const allWordsAreExact =
        words.every(word => dictionaryWordSet.has(word));

    if (allWordsAreExact) {

        return {
            score: 100,
            exactLineMatch: false,
            allWordsExact: true,
            exactWords: words.length,
            partialWords: 0,
            totalWords: words.length,
            details: words.map(w => `${w} (100%)`)
        };
    }

    let totalLetters = 0;
    let exactLetters = 0;
    let partialBonus = 0;

    let exactWords = 0;
    let partialWords = 0;

    const details = [];

    for (const word of words) {

        const len = word.length;

        totalLetters += len;

        if (dictionaryWordSet.has(word)) {

            exactWords++;
            exactLetters += len;

            details.push(`${word} (100%)`);

            continue;
        }

        const partialScore = getStrictPartialWordScore(word);

        if (partialScore > 0) {

            partialWords++;

            partialBonus +=
                len * (partialScore / 100) * 0.12;

            details.push(`${word} (${partialScore.toFixed(1)}%)`);

        } else {

            details.push(`${word} (0%)`);
        }
    }

    let finalScore = 0;

    if (totalLetters > 0) {

        finalScore =
            ((exactLetters + partialBonus) / totalLetters) * 100;
    }

    if (finalScore > 100) finalScore = 100;

    return {
        score: finalScore,
        exactLineMatch: false,
        allWordsExact: false,
        exactWords,
        partialWords,
        totalWords: words.length,
        details
    };
}


function analyze() {

    const cipherInput =
        document.getElementById("cipher").value.trim();

    if (!cipherInput) {

        document.getElementById("output").innerHTML =
            "<p>Skriv inn tekst først.</p>";

        return;
    }

    if (
        dictionaryWordSet.size === 0 &&
        dictionaryLineSet.size === 0
    ) {

        document.getElementById("output").innerHTML =
            "<p>Ordliste er ikke lastet ennå. Prøv igjen om et øyeblikk.</p>";

        return;
    }

    const shifts = [];

    for (let shift = 0; shift < alphabetLength; shift++) {

        const plain = caesarDecrypt(cipherInput, shift);

        const analysis = scoreCandidateText(plain);

        shifts.push({
            shift,
            text: plain,
            probability: analysis.score,
            exactLineMatch: analysis.exactLineMatch,
            allWordsExact: analysis.allWordsExact,
            exactWords: analysis.exactWords,
            partialWords: analysis.partialWords,
            totalWords: analysis.totalWords,
            details: analysis.details
        });
    }

    const ranked = [...shifts].sort((a, b) => {

        if (b.probability !== a.probability)
            return b.probability - a.probability;

        if (b.exactWords !== a.exactWords)
            return b.exactWords - a.exactWords;

        return a.shift - b.shift;
    });

    const best = ranked[0];

    document.getElementById("output").innerHTML = `
        <h3>Mest sannsynlige dekryptering</h3>
        <p>
        <strong>${escapeHtml(best.text)}</strong><br>
        Shift ${best.shift} · score ${best.probability.toFixed(1)}%
        </p>

        <h3>Topp 10 dekrypteringer</h3>

        <pre>${escapeHtml(
            ranked
                .slice(0, 10)
                .map(item =>
                    `${item.shift}: ${item.text}  [${item.probability.toFixed(1)}%]`
                )
                .join("\n")
        )}</pre>
    `;

    drawChart(shifts, best.shift);
}


function drawChart(shiftResults, bestShift) {

    const ctx = document.getElementById("chart").getContext("2d");

    if (chartInstance) {
        chartInstance.destroy();
    }

    const labels =
        shiftResults.map(item => `Shift ${item.shift}`);

    const data =
        shiftResults.map(item =>
            Number(item.probability.toFixed(1))
        );

    chartInstance = new Chart(ctx, {

        type: "bar",

        data: {

            labels,

            datasets: [{
                label: "Sannsynlighet",
                data
            }]
        },

        options: {

            responsive: true,
            maintainAspectRatio: false,

            scales: {

                y: {
                    beginAtZero: true,
                    max: 100
                }
            }
        }
    });
}

</script>

</body>
</html>
