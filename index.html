<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <title>Caesar-dekryptering med norsk alfabet</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="app-shell">
        <div class="app-card">
            <div class="hero">
                <p class="eyebrow">Kryptografi-verktøy</p>
                <h1>Caesar-dekryptering med norsk alfabet</h1>
                <p class="subtitle">
                    Skriv inn kryptert tekst og analyser alle mulige Caesar-skift i det norske alfabetet, inkludert Æ, Ø og Å.
                </p>
            </div>

            <div class="input-section">
                <label for="cipher">Kryptert tekst</label>
                <div class="input-row">
                    <input id="cipher" type="text" placeholder="f.eks. OFLJWKQDLJW">
                    <button onclick="analyze()">Analyser</button>
                </div>
            </div>

            <div class="chart-section">
                <canvas id="chart"></canvas>
            </div>

            <div id="output" class="output-card"></div>
        </div>
    </div>

<script>
// Norsk alfabet med Æ Ø Å
const norwegianAlphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZÆØÅ";
const alphabetLength = norwegianAlphabet.length;

let norwegianWordsSet = new Set();

// ---------------------------
// Last inn ordlisten
// ---------------------------
fetch('ordliste.txt')
  .then(response => response.text())
  .then(data => {
    norwegianWordsSet = new Set(data.split(/\r?\n/).map(w => w.toLowerCase()));
    console.log("Ordbok lastet: " + norwegianWordsSet.size + " ord");
  });

// ---------------------------
// Caesar-dekryptering med norsk alfabet
// ---------------------------
function caesarDecrypt(text, shift) {
    return text.split("").map(c => {
        const upperC = c.toUpperCase();
        const index = norwegianAlphabet.indexOf(upperC);
        if (index === -1) return c;
        const newIndex = (index - shift + alphabetLength) % alphabetLength;
        return norwegianAlphabet[newIndex];
    }).join("");
}

// ---------------------------
// Finn beste substring-match
// ---------------------------
function bestSubstringMatch(word) {
    const w = word.toLowerCase();
    let maxScore = 0;

    norwegianWordsSet.forEach(ow => {
        const o = ow.toLowerCase();

        if (w === o) {
            maxScore = 100;
            return;
        }

        if (o.length > w.length) return;

        for (let i = 0; i <= w.length - o.length; i++) {
            const sub = w.substring(i, i + o.length);
            if (sub === o) {
                const score = (o.length / w.length) * 100;
                if (score > maxScore) maxScore = score;
            }
        }
    });

    return maxScore;
}

// ---------------------------
// Analysefunksjon
// ---------------------------
let chartInstance = null;
function analyze() {
    const cipher = document.getElementById("cipher").value.toUpperCase().trim();
    if (!cipher) return;

    const shifts = [];
    const labels = [];
    const probabilities = [];

    for (let s = 1; s <= alphabetLength - 1; s++) {
        const plain = caesarDecrypt(cipher, s);
        const score = bestSubstringMatch(plain);

        shifts.push({shift: s, text: plain, probability: score});
        labels.push("Shift " + s);
        probabilities.push(score.toFixed(1));
    }

    const best = shifts.reduce((a, b) => a.probability > b.probability ? a : b);

    document.getElementById("output").innerHTML =
        `<h3>Mest sannsynlige dekryptering</h3>
        <p><strong>${best.text}</strong> (Shift ${best.shift}, score ${best.probability.toFixed(1)}%)</p>
        <h3>Alle dekrypteringer</h3>
        <pre>${shifts.map(s => `${s.shift}: ${s.text}  [${s.probability.toFixed(1)}%]`).join("\n")}</pre>`;

    drawChart(labels, probabilities);
}

// ---------------------------
// Tegn graf med Chart.js
// ---------------------------
function drawChart(labels, data) {
    const ctx = document.getElementById("chart").getContext("2d");
    if (chartInstance) chartInstance.destroy();

    chartInstance = new Chart(ctx, {
        type: "bar",
        data: {
            labels: labels,
            datasets: [{
                label: "Prosent match med ordliste",
                data: data,
                backgroundColor: "rgba(79, 70, 229, 0.75)",
                borderRadius: 8,
                borderSkipped: false
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
                y: {
                    beginAtZero: true,
                    max: 100,
                    title: { display: true, text: "Prosent (%)" }
                }
            }
        }
    });
}
</script>

</body>
</html>
