<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <title>Caesar-dekryptering med norsk alfabet</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-shell">
        <div class="app-card">
            <div class="hero">
                <p class="eyebrow">Kryptografi-verktøy</p>
                <h1>Caesar-dekryptering med norsk alfabet</h1>
                <p class="subtitle">
                    Skriv inn ett ord eller en setning. Verktøyet prøver alle Caesar-skift i det norske alfabetet, inkludert Æ, Ø og Å.
                </p>
            </div>

            <div class="input-section">
                <label for="cipher">Kryptert tekst</label>
                <div class="input-row">
                    <input id="cipher" type="text" placeholder="f.eks. Mhj hu nxo">
                    <button onclick="analyze()">Analyser</button>
                </div>
            </div>

            <div class="chart-section">
                <canvas id="chart"></canvas>
            </div>

            <div id="output" class="output-card"></div>
        </div>
    </div>

<script>
// Norsk alfabet med Æ Ø Å
const norwegianAlphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZÆØÅ";
const alphabetLength = norwegianAlphabet.length;

let dictionaryLineSet = new Set();   // Hele linjer / fraser
let dictionaryWordSet = new Set();   // Enkeltord
let dictionaryWordsArray = [];       // For delmatch
let chartInstance = null;

// ---------------------------
// Normalisering
// ---------------------------
function normalizeText(text) {
    return text
        .toUpperCase()
        .replace(/[^A-ZÆØÅ0-9\s]/g, " ")
        .replace(/\s+/g, " ")
        .trim();
}

function extractWords(text) {
    const normalized = normalizeText(text);
    if (!normalized) return [];
    return normalized.split(" ").filter(Boolean);
}

// ---------------------------
// Last inn ordlisten
// ---------------------------
fetch("ordliste.txt")
    .then(response => response.text())
    .then(data => {
        const rawLines = data.split(/\r?\n/);

        const normalizedLines = rawLines
            .map(line => normalizeText(line))
            .filter(Boolean);

        dictionaryLineSet = new Set(normalizedLines);

        const wordSet = new Set();
        for (const line of normalizedLines) {
            const words = extractWords(line);
            for (const word of words) {
                wordSet.add(word);
            }
        }

        dictionaryWordSet = wordSet;
        dictionaryWordsArray = Array.from(dictionaryWordSet);

        console.log("Ordliste lastet:");
        console.log("- Linjer/fraseoppføringer:", dictionaryLineSet.size);
        console.log("- Unike ord:", dictionaryWordSet.size);
    })
    .catch(error => {
        console.error("Kunne ikke laste ordliste.txt:", error);
        document.getElementById("output").innerHTML =
            "<p><strong>Feil:</strong> Kunne ikke laste ordliste.txt.</p>";
    });

// ---------------------------
// Caesar-dekryptering
// ---------------------------
function caesarDecrypt(text, shift) {
    return text.split("").map(char => {
        const upperChar = char.toUpperCase();
        const index = norwegianAlphabet.indexOf(upperChar);

        if (index === -1) return char;

        const newIndex = (index - shift + alphabetLength) % alphabetLength;
        return norwegianAlphabet[newIndex];
    }).join("");
}

// ---------------------------
// Enkel delmatch for ett ord
// Bare brukt hvis ordet ikke matcher eksakt
// ---------------------------
function getPartialWordScore(word) {
    if (!word || word.length < 3) return 0;

    let bestScore = 0;

    for (const dictWord of dictionaryWordsArray) {
        if (dictWord.length < 3) continue;

        // Eksakt match håndteres et annet sted
        if (word === dictWord) return 100;

        // Kandidatord inneholder et ordboksord
        if (word.includes(dictWord)) {
            const score = (dictWord.length / word.length) * 100;
            if (score > bestScore) bestScore = score;
        }

        // Ordboksord inneholder kandidatord
        if (dictWord.includes(word)) {
            const score = (word.length / dictWord.length) * 100;
            if (score > bestScore) bestScore = score;
        }
    }

    // Ikke stol på veldig svake deltreff
    if (bestScore < 60) return 0;

    return bestScore;
}

// ---------------------------
// Score hel kandidattekst
// ---------------------------
function scoreCandidateText(text) {
    const normalizedText = normalizeText(text);
    const words = extractWords(text);

    if (!normalizedText || words.length === 0) {
        return {
            score: 0,
            exactLineMatch: false,
            allWordsExact: false,
            exactWords: 0,
            partialWords: 0,
            totalWords: 0,
            details: []
        };
    }

    // 1) Eksakt hel-linje-match = 100 %
    if (dictionaryLineSet.has(normalizedText)) {
        return {
            score: 100,
            exactLineMatch: true,
            allWordsExact: true,
            exactWords: words.length,
            partialWords: 0,
            totalWords: words.length,
            details: words.map(w => `${w} (100%)`)
        };
    }

    // 2) Hvis alle ord matcher eksakt = 100 %
    const allWordsAreExact = words.every(word => dictionaryWordSet.has(word));
    if (allWordsAreExact) {
        return {
            score: 100,
            exactLineMatch: false,
            allWordsExact: true,
            exactWords: words.length,
            partialWords: 0,
            totalWords: words.length,
            details: words.map(w => `${w} (100%)`)
        };
    }

    // 3) Ellers: vekting per ordlengde
    let totalWeight = 0;
    let earnedWeight = 0;
    let exactWords = 0;
    let partialWords = 0;
    const details = [];

    for (const word of words) {
        const weight = Math.max(word.length, 1);
        totalWeight += weight;

        if (dictionaryWordSet.has(word)) {
            exactWords++;
            earnedWeight += weight;
            details.push(`${word} (100%)`);
            continue;
        }

        const partialScore = getPartialWordScore(word);

        if (partialScore > 0) {
            partialWords++;
            // Deltreff teller, men mye svakere enn eksakt treff
            earnedWeight += weight * (partialScore / 100) * 0.45;
            details.push(`${word} (${partialScore.toFixed(1)}%)`);
        } else {
            details.push(`${word} (0%)`);
        }
    }

    let finalScore = totalWeight > 0 ? (earnedWeight / totalWeight) * 100 : 0;

    // Liten bonus hvis mange ord er eksakte
    const exactRatio = exactWords / words.length;
    finalScore += exactRatio * 10;

    if (finalScore > 100) finalScore = 100;

    return {
        score: finalScore,
        exactLineMatch: false,
        allWordsExact: false,
        exactWords,
        partialWords,
        totalWords: words.length,
        details
    };
}

// ---------------------------
// HTML-escaping
// ---------------------------
function escapeHtml(text) {
    return text
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;");
}

// ---------------------------
// Analysefunksjon
// ---------------------------
function analyze() {
    const cipherInput = document.getElementById("cipher").value.trim();

    if (!cipherInput) {
        document.getElementById("output").innerHTML = "<p>Skriv inn tekst først.</p>";
        return;
    }

    if (dictionaryWordSet.size === 0 && dictionaryLineSet.size === 0) {
        document.getElementById("output").innerHTML =
            "<p>Ordliste er ikke lastet ennå. Prøv igjen om et øyeblikk.</p>";
        return;
    }

    const shifts = [];
    const labels = [];
    const probabilities = [];

    // Merk: nå tester vi også shift 0
    for (let shift = 0; shift < alphabetLength; shift++) {
        const plain = caesarDecrypt(cipherInput, shift);
        const analysis = scoreCandidateText(plain);

        shifts.push({
            shift,
            text: plain,
            probability: analysis.score,
            exactLineMatch: analysis.exactLineMatch,
            allWordsExact: analysis.allWordsExact,
            exactWords: analysis.exactWords,
            partialWords: analysis.partialWords,
            totalWords: analysis.totalWords,
            details: analysis.details
        });

        labels.push("Shift " + shift);
        probabilities.push(Number(analysis.score.toFixed(1)));
    }

    // Sorter etter høyest score
    const ranked = [...shifts].sort((a, b) => b.probability - a.probability);
    const best = ranked[0];

    document.getElementById("output").innerHTML = `
        <h3>Mest sannsynlige dekryptering</h3>
        <p>
            <strong>${escapeHtml(best.text)}</strong><br>
            Shift ${best.shift} · score ${best.probability.toFixed(1)}%
        </p>

        <p>
            Eksakte ord: ${best.exactWords}/${best.totalWords}<br>
            Deltreff: ${best.partialWords}<br>
            Eksakt frasematch: ${best.exactLineMatch ? "Ja" : "Nei"}<br>
            Alle ord eksakte: ${best.allWordsExact ? "Ja" : "Nei"}
        </p>

        <h3>Ordvurdering</h3>
        <p>${escapeHtml(best.details.join(", "))}</p>

        <h3>Topp 10 dekrypteringer</h3>
        <pre>${escapeHtml(
            ranked
                .slice(0, 10)
                .map(item =>
                    `${item.shift}: ${item.text}  [${item.probability.toFixed(1)}% | eksakte ord: ${item.exactWords}/${item.totalWords} | deltreff: ${item.partialWords}]`
                )
                .join("\n")
        )}</pre>
    `;

    drawChart(shifts, best.shift);
}

// ---------------------------
// Tegn graf med Chart.js
// ---------------------------
function drawChart(shiftResults, bestShift) {
    const ctx = document.getElementById("chart").getContext("2d");

    if (chartInstance) {
        chartInstance.destroy();
    }

    const labels = shiftResults.map(item => `Shift ${item.shift}`);
    const data = shiftResults.map(item => Number(item.probability.toFixed(1)));
    const backgroundColors = shiftResults.map(item =>
        item.shift === bestShift
            ? "rgba(16, 185, 129, 0.85)"
            : "rgba(79, 70, 229, 0.75)"
    );

    chartInstance = new Chart(ctx, {
        type: "bar",
        data: {
            labels,
            datasets: [{
                label: "Sannsynlighet basert på ordtreff",
                data,
                backgroundColor: backgroundColors,
                borderRadius: 8,
                borderSkipped: false
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: {
                    labels: {
                        color: "#334155"
                    }
                },
                tooltip: {
                    callbacks: {
                        label: function(context) {
                            return ` Score: ${context.raw}%`;
                        }
                    }
                }
            },
            scales: {
                x: {
                    ticks: {
                        color: "#475569"
                    },
                    grid: {
                        display: false
                    }
                },
                y: {
                    beginAtZero: true,
                    max: 100,
                    ticks: {
                        color: "#475569"
                    },
                    title: {
                        display: true,
                        text: "Prosent (%)",
                        color: "#334155"
                    },
                    grid: {
                        color: "rgba(148, 163, 184, 0.2)"
                    }
                }
            }
        }
    });
}
</script>
</body>
</html>
