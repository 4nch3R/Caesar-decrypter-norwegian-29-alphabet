<!DOCTYPE html>
<html lang="no">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Caesar kode dekryptering (norsk alfabet ÆØÅ)</title>

    <meta name="description"
        content="Dekrypter Caesar-kode med norsk alfabet (A–Z, Æ, Ø, Å). Verktøyet tester alle 29 skift automatisk.">

    <link rel="canonical"
        href="https://4nch3r.github.io/Caesar-decrypter-norwegian-29-alphabet/">

    <link rel="stylesheet" href="style.css">

</head>


<body>


<div class="app-shell">

<div class="app-card">


<div class="hero">

<h1>Caesar dekryptering – norsk alfabet</h1>

<p class="subtitle">
Dekrypter Caesar-kode med norsk alfabet (A–Z Æ Ø Å). Verktøyet tester alle 29 skift.
</p>

</div>



<div class="input-section">

<label for="cipher">Kryptert tekst</label>

<div class="input-row">

<input
    id="cipher"
    type="text"
    placeholder="f.eks. Mhj hu nxo"
    onkeydown="handleKeyPress(event)"
>

<button class="primary-btn" onclick="analyze()">
Analyser
</button>

<button class="secondary-btn danger-btn" onclick="clearAll()">
Tøm
</button>

</div>

</div>



<div class="chart-card">

<div class="section-header">

<h2>Skiftanalyse</h2>

</div>

<div class="chart-section">

<canvas id="chart"></canvas>

</div>

</div>



<div id="output" class="output-card">

<div class="empty-state">

<h3>Klar</h3>

<p>Skriv inn tekst og trykk analyser</p>

</div>

</div>



</div>
</div>



<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>


<script>

const norwegianAlphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZÆØÅ"
const alphabetLength = norwegianAlphabet.length

let dictionaryWordSet = new Set()
let dictionaryWordsArray = []

let chartInstance = null



function normalizeText(text)
{
    return text
        .toUpperCase()
        .replace(/[^A-ZÆØÅ\s]/g, " ")
        .replace(/\s+/g, " ")
        .trim()
}



function extractWords(text)
{
    const normalized = normalizeText(text)

    if (!normalized) return []

    return normalized.split(" ")
}



function escapeHtml(text)
{
    return text
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
}



function handleKeyPress(event)
{
    if (event.key === "Enter")
    {
        analyze()
    }
}



function clearAll()
{
    document.getElementById("cipher").value = ""

    document.getElementById("output").innerHTML = `
        <div class="empty-state">
            <h3>Klar</h3>
            <p>Skriv inn tekst og trykk analyser</p>
        </div>
    `

    if (chartInstance)
    {
        chartInstance.destroy()
        chartInstance = null
    }
}



fetch("ordliste.txt")

.then(response => response.text())

.then(data =>
{

    const lines = data
        .split(/\r?\n/)
        .map(w => normalizeText(w))
        .filter(Boolean)


    for (const line of lines)
    {
        const words = line.split(" ")

        for (const word of words)
        {
            dictionaryWordSet.add(word)
        }
    }


    dictionaryWordsArray = [...dictionaryWordSet]

})



function caesarDecrypt(text, shift)
{
    return text
        .split("")
        .map(char =>
        {
            const upper = char.toUpperCase()

            const index = norwegianAlphabet.indexOf(upper)

            if (index === -1)
            {
                return char
            }

            const newIndex =
                (index - shift + alphabetLength) % alphabetLength

            return norwegianAlphabet[newIndex]
        })
        .join("")
}



function longestPrefixMatchLength(word)
{
    let best = 0

    for (const dictWord of dictionaryWordsArray)
    {
        const maxCheck = Math.min(word.length, dictWord.length)

        let matchLen = 0

        while (
            matchLen < maxCheck &&
            word[matchLen] === dictWord[matchLen]
        )
        {
            matchLen++
        }

        if (matchLen > best)
        {
            best = matchLen
        }
    }

    return best
}



function scoreWord(word)
{
    const w = word.toUpperCase()


    if (dictionaryWordSet.has(w))
    {
        return {
            score: 100,
            prefixLetters: w.length,
            exact: true
        }
    }


    const prefix = longestPrefixMatchLength(w)


    if (prefix < 3)
    {
        return {
            score: 0,
            prefixLetters: 0,
            exact: false
        }
    }


    return {
        score: (prefix / w.length) * 100,
        prefixLetters: prefix,
        exact: false
    }
}



function scoreCandidateText(text)
{

    const words = extractWords(text)

    let totalLetters = 0
    let matchedLetters = 0

    let exactWords = 0
    let partialWords = 0

    const details = []


    for (const word of words)
    {
        const len = word.length

        totalLetters += len

        const result = scoreWord(word)


        if (result.exact)
        {
            exactWords++
            matchedLetters += len

            details.push(`${word} (100%)`)
        }

        else if (result.score > 0)
        {
            partialWords++
            matchedLetters += result.prefixLetters

            details.push(`${word} (${result.score.toFixed(1)}%)`)
        }

        else
        {
            details.push(`${word} (0%)`)
        }
    }


    const score =
        totalLetters > 0
            ? (matchedLetters / totalLetters) * 100
            : 0


    return {
        score,
        exactWords,
        partialWords,
        totalWords: words.length,
        details
    }

}



function analyze()
{

    const cipher =
        document.getElementById("cipher").value.trim()

    if (!cipher) return


    const shifts = []


    for (let shift = 0; shift < alphabetLength; shift++)
    {
        const plain = caesarDecrypt(cipher, shift)

        const analysis = scoreCandidateText(plain)

        shifts.push({

            shift,
            text: plain,
            probability: analysis.score,

            exactWords: analysis.exactWords,
            partialWords: analysis.partialWords,
            totalWords: analysis.totalWords,

            details: analysis.details
        })
    }



    const ranked =
        [...shifts].sort((a, b) =>
            b.probability - a.probability
        )


    const best = ranked[0]



    document.getElementById("output").innerHTML = `

<h2>Mest sannsynlig dekryptering</h2>

<div class="decoded-box">
${escapeHtml(best.text)}
</div>

<div class="details-card">

<h3>Ordvurdering</h3>

<p>
${escapeHtml(best.details.join(", "))}
</p>

</div>


<div class="details-card">

<h3>Alle 29 skift</h3>

<pre>

${ranked
.map(item =>
`${item.shift}: ${item.text} (${item.probability.toFixed(1)}%)`
)
.join("\n")}

</pre>

</div>

`


drawChart(shifts, best.shift)

}



function drawChart(results, bestShift)
{

const ctx =
document.getElementById("chart").getContext("2d")


if (chartInstance)
{
chartInstance.destroy()
}


chartInstance = new Chart(ctx,
{

type: "bar",

data:
{
labels: results.map(r => r.shift),

datasets:
[
{
label: "Score",

data: results.map(r => r.probability),

backgroundColor:
results.map(r =>
r.shift === bestShift
? "#34d399"
: "#6366f1"
)
}
]
},

options:
{
responsive: true,
maintainAspectRatio: false
}

})

}

</script>

</body>
</html>
